{% extends "base.html" %}
{% block title %}Add Leave Type{% endblock %}
{% block content %}
<h1>Add leave type</h1>
<form method="post">
<label>Name <input name="name" required></label>
<label>Days allowed <input name="days_allowed" type="number" required></label>
<label>Description <input name="description" required></label>
<button>Save</button>
</form>
{% endblock %}
